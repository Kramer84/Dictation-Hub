# Lower Tailscale's MTU on the dictation server, so every client (CLI, phone)
# works over network paths that drop packets above ~1216 bytes (hotel wifi,
# 4G). Tailscale's default 1280 is then silently lost: small requests work,
# uploads and longer answers stall. See docs/milestones/README.md, 2026-10-25.
#
# Install on the host:
#   sudo mkdir -p /etc/systemd/system/tailscaled.service.d
#   sudo cp configs/systemd/tailscaled-mtu.conf /etc/systemd/system/tailscaled.service.d/mtu.conf
#   sudo systemctl daemon-reload
# It applies the next time tailscaled starts (reboot, or `sudo systemctl
# restart tailscaled`, which drops Tailscale SSH sessions for a few seconds).
# Check with: ip link show tailscale0   (should say "mtu 1200")
[Service]
# tailscale0 appears shortly after tailscaled starts: wait up to 10 s for it.
ExecStartPost=/bin/sh -c 'for i in $(seq 1 20); do ip link show tailscale0 >/dev/null 2>&1 && exec ip link set dev tailscale0 mtu 1200; sleep 0.5; done; echo "tailscale0 not found, MTU unchanged" >&2'
